<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Список покупок</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Модальное окно выбора профиля (при первом запуске) -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h2>👋 Выберите профиль</h2>
            <p>Введите ваше имя и выберите аватар</p>
            <div class="modal-body">
                <div class="avatar-grid" id="avatarGrid"></div>
                <div class="name-input-wrap">
                    <input type="text" id="userNameInput" placeholder="Ваше имя..." maxlength="20" />
                </div>
                <button id="saveProfileBtn" class="save-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования профиля (клик по аватару) -->
    <div id="editProfileModal" class="modal">
        <div class="modal-content">
            <h2>✏️ Редактировать профиль</h2>
            <p>Измените имя или аватар</p>
            <div class="modal-body">
                <div class="avatar-grid" id="editAvatarGrid"></div>
                <div class="name-input-wrap">
                    <input type="text" id="editUserNameInput" placeholder="Ваше имя..." maxlength="20" />
                </div>
                <div class="modal-actions">
                    <button id="saveEditProfileBtn" class="save-btn">Сохранить</button>
                    <button id="logoutBtn" class="logout-btn">🚪 Выйти</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Основное приложение -->
    <div class="app" id="app">
        <div class="header">
            <span class="header-icon">🛒</span>
            <h1>Список покупок</h1>
            <div class="header-right">
                <span id="profileDisplay" class="profile-display" title="Нажмите для редактирования"></span>
                <button class="theme-toggle" id="themeToggle" title="Переключить тему">☀️</button>
            </div>
        </div>

        <div id="dropZones" class="drop-zones hidden">
            <div class="drop-zone" data-category="food">🍔 Еда</div>
            <div class="drop-zone" data-category="other">🛒 Остальное</div>
        </div>

        <div class="product-list" id="productList"></div>

        <div class="archive-container" id="archiveContainer">
            <button class="archive-toggle" id="archiveToggle">
                <span>📦</span> Куплено ранее (<span id="archiveCount">0</span>)
            </button>
            <div class="archive-items" id="archiveItems" style="display: none;"></div>
        </div>
    </div>

    <div class="input-area" id="inputArea">
        <div class="category-selector">
            <button class="cat-btn active" data-category="food" title="Еда">
                <span>🍔</span> Еда
            </button>
            <button class="cat-btn" data-category="other" title="Остальное">
                <span>🛒</span> Остальное
            </button>
        </div>
        <div class="input-row">
            <input type="text" id="productInput" placeholder="Напишите продукт..." autocomplete="off" />
            <button id="addButton">Добавить</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
