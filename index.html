<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Список покупок</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app" id="app">
        <div class="header">
            <span class="header-icon">🛒</span>
            <h1>Список покупок</h1>
            <button class="theme-toggle" id="themeToggle" title="Переключить тему">🌙</button>
        </div>

        <!-- Зоны для сброса при перетаскивании -->
        <div id="dropZones" class="drop-zones hidden">
            <div class="drop-zone" data-category="food">🍔 Еда</div>
            <div class="drop-zone" data-category="other">🛒 Остальное</div>
        </div>

        <div class="product-list" id="productList"></div>

        <div class="archive-container" id="archiveContainer">
            <button class="archive-toggle" id="archiveToggle">
                <span>📦</span> Куплено ранее (<span id="archiveCount">0</span>)
            </button>
            <div class="archive-items" id="archiveItems" style="display: none;"></div>
        </div>
    </div>

    <!-- Нижняя панель: две строки -->
    <div class="input-area" id="inputArea">
        <!-- Строка 1: выбор категории -->
        <div class="category-selector">
            <button class="cat-btn active" data-category="food" title="Еда">
                <span>🍔</span> Еда
            </button>
            <button class="cat-btn" data-category="other" title="Остальное">
                <span>🛒</span> Остальное
            </button>
        </div>
        <!-- Строка 2: ввод и кнопка Добавить -->
        <div class="input-row">
            <input type="text" id="productInput" placeholder="Напишите продукт..." autocomplete="off" />
            <button id="addButton">Добавить</button>
        </div>
    </div>

    <!-- Контейнер для уведомлений -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
